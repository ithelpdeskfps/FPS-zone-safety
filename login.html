<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zone Safety - Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      display: flex;

      align-items: center;

    }

    .login-box {
      width: 90%;
      max-width: 400px;

      text-align: center;
    }

    h1 {
      margin-bottom: 8px;
      color: #111827;
    }

    .subtitle {
      color: #6b7280;

    input {
      width: 100%;
      padding: 13px;

      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      margin-top: 15px;
      color: #dc2626;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Zone Safety</h1>

    <div class="subtitle">
      Safety Check-In System
    </div>

    <input
      type="email"
      id="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button onclick="login()">
      Sign In
    </button>

    <div id="message"></div>

  </div>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

 import {
  getAuth,
  setPersistence,
  browserLocalPersistence,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB0--wrOqeid_iVGJkqDwJAWBefPyI4HPw",
      authDomain: "fps-zone-safety.firebaseapp.com",
      projectId: "fps-zone-safety",
      storageBucket: "fps-zone-safety.firebasestorage.app",
      messagingSenderId: "96363004027",
      appId: "1:96363004027:web:101c3b8ba1fde53655e2de",
      measurementId: "G-WEK1MZ48M2"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

await setPersistence(auth, browserLocalPersistence);

    window.login = async function() {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      message.textContent = "";

      if (!email || !password) {
        message.textContent = "Please enter your email and password.";
        return;
      }

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        window.location.href = "index.html";

      } catch (error) {

        console.error(error);

        message.textContent =
          "Login failed. Please check your email and password.";

      }

    };

  </script>

</body>
</html>
