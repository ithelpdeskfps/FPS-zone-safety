<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zone Safety Login</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 420px;
      margin: 80px auto;
    }

    .login-card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      color: #17365d;
      margin-top: 0;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      background: #17365d;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="login-card">

      <h1>Zone Safety</h1>

      <div class="subtitle">
        Please sign in to continue
      </div>

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="username"
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
      >

      <button id="loginButton">
        LOGIN
      </button>

      <div id="message"></div>

    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      setPersistence,
      browserLocalPersistence,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    /*
      YOUR EXISTING FIREBASE CONFIG
    */

    const firebaseConfig = {

      apiKey:
        "AIzaSyB0--wrOqeid_iVGJkqDwJAWBefPyI4HPQw",

      authDomain:
        "fps-zone-safety.firebaseapp.com",

      projectId:
        "fps-zone-safety",

      storageBucket:
        "fps-zone-safety.firebasestorage.app",

      messagingSenderId:
        "96363004027",

      appId:
        "1:96363004027:web:101c3b8ba1fde53655e2de",

      measurementId:
        "G-WEK1MZ48M2"

    };


    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const email =
      document.getElementById("email");


    const password =
      document.getElementById("password");


    const loginButton =
      document.getElementById("loginButton");


    const message =
      document.getElementById("message");


    async function login() {

      const emailValue =
        email.value.trim();


      const passwordValue =
        password.value;


      message.textContent = "";


      if (!emailValue || !passwordValue) {

        message.style.color =
          "#dc2626";

        message.textContent =
          "Please enter your email and password.";

        return;

      }


      loginButton.disabled =
        true;


      loginButton.textContent =
        "LOGGING IN...";


      try {

        /*
          Keep the login session in the browser.
        */

        await setPersistence(
          auth,
          browserLocalPersistence
        );


        /*
          Sign in with Firebase Authentication.
        */

        await signInWithEmailAndPassword(
          auth,
          emailValue,
          passwordValue
        );


        message.style.color =
          "#166534";

        message.textContent =
          "Login successful. Opening dashboard...";


        /*
          Give Firebase a moment to finish
          storing the authentication session.
        */

        setTimeout(
          function() {

            window.location.href =
              "index.html";

          },
          500
        );

      }


      catch (error) {

        console.error(
          "Firebase login error:",
          error
        );


        message.style.color =
          "#dc2626";


        /*
          Show the REAL Firebase error.
        */

        message.textContent =
          "Login failed: " +
          error.code;


        loginButton.disabled =
          false;


        loginButton.textContent =
          "LOGIN";

      }

    }


    loginButton.addEventListener(
      "click",
      login
    );


    password.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          login();

        }

      }
    );

  </script>

</body>
</html>
