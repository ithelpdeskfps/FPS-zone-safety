```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zone Safety Check-In</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .header {
      background: #17365d;
      color: white;
      padding: 18px;
      text-align: center;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .zone-card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      text-align: center;
    }

    .zone-title {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #17365d;
    }

    .zone-people {
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .status-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
    }

    .status-button {
      width: 220px;
      height: 60px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      text-align: center;
    }

    .safe-button {
      background: #16a34a;
    }

    .missing-button {
      background: #f59e0b;
    }

    .unsafe-button {
      background: #dc2626;
    }

    .status-button:hover {
      opacity: 0.9;
    }

    .form-box {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border-radius: 10px;
      text-align: left;
    }

    .missing-form {
      background: #fff7e6;
      border: 1px solid #f59e0b;
    }

    .unsafe-form {
      background: #fff0f0;
      border: 1px solid #dc2626;
    }

    .form-box h3 {
      margin-top: 0;
      text-align: center;
    }

    .form-box label {
      display: block;
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 5px;
    }

    .form-box input,
    .form-box textarea,
    .form-box select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .form-box textarea {
      min-height: 90px;
      resize: vertical;
    }

    .save-button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: none;
      border-radius: 7px;
      background: #17365d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .cancel-button {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #aaa;
      border-radius: 7px;
      background: white;
      color: #333;
      font-size: 15px;
      cursor: pointer;
    }

    .result {
      display: none;
      margin-top: 25px;
      padding: 18px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
    }

    .result.safe {
      background: #dcfce7;
      color: #166534;
    }

    .result.missing {
      background: #fef3c7;
      color: #92400e;
    }

    .result.unsafe {
      background: #fee2e2;
      color: #991b1b;
    }

    .back-button {
      display: block;
      width: 220px;
      margin: 25px auto 0;
      padding: 12px;
      text-align: center;
      background: #17365d;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

  </style>
</head>


<body>


  <div class="header">

    <h1>Zone Safety Check-In</h1>

  </div>


  <div class="container">

    <div class="zone-card">

      <div id="zoneTitle" class="zone-title">
        Zone
      </div>

      <div id="zonePeople" class="zone-people">
      </div>


      <div class="status-buttons">

        <button
          id="safeButton"
          class="status-button safe-button">
          ALL SAFE
        </button>

        <button
          id="missingButton"
          class="status-button missing-button">
          MISSING
        </button>

        <button
          id="unsafeButton"
          class="status-button unsafe-button">
          NOT SAFE
        </button>

      </div>


      <!-- MISSING FORM -->

      <div
        id="missingForm"
        class="form-box missing-form">

        <h3>Missing Person Details</h3>

        <label for="personName">
          Person's Name
        </label>

        <input
          type="text"
          id="personName"
          placeholder="Enter person's name"
        >

        <label for="lastLocation">
          Last Known Location
        </label>

        <input
          type="text"
          id="lastLocation"
          placeholder="Example: Classroom C2"
        >

        <label for="missingDetails">
          Additional Details
        </label>

        <textarea
          id="missingDetails"
          placeholder="Enter any additional information"></textarea>

        <button
          id="saveMissingButton"
          class="save-button">
          Save Missing Report
        </button>

        <button
          id="cancelMissingButton"
          class="cancel-button">
          Cancel
        </button>

      </div>


      <!-- NOT SAFE FORM -->

      <div
        id="unsafeForm"
        class="form-box unsafe-form">

        <h3>Safety Concern Details</h3>

        <label for="safetyConcern">
          What is the safety concern?
        </label>

        <input
          type="text"
          id="safetyConcern"
          placeholder="Example: Fire, smoke, damaged area"
        >

        <label for="issueLocation">
          Where is the issue?
        </label>

        <input
          type="text"
          id="issueLocation"
          placeholder="Example: Corridor outside C2"
        >

        <label for="unsafeDetails">
          Additional Details
        </label>

        <textarea
          id="unsafeDetails"
          placeholder="Enter any additional information"></textarea>

        <label for="immediateAssistance">
          Is immediate assistance required?
        </label>

        <select id="immediateAssistance">

          <option value="">
            Please select
          </option>

          <option value="Yes">
            Yes
          </option>

          <option value="No">
            No
          </option>

        </select>

        <button
          id="saveUnsafeButton"
          class="save-button">
          Save Safety Report
        </button>

        <button
          id="cancelUnsafeButton"
          class="cancel-button">
          Cancel
        </button>

      </div>


      <div
        id="result"
        class="result">
      </div>


      <a
        href="zones.html"
        class="back-button">
        Back to Zones
      </a>

    </div>

  </div>


  <!-- FIREBASE -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyB0--wrOqeid_iVGJkqDwJAWBefPyI4HPw",

      authDomain:
        "fps-zone-safety.firebaseapp.com",

      projectId:
        "fps-zone-safety",

      storageBucket:
        "fps-zone-safety.firebasestorage.app",

      messagingSenderId:
        "96363004027",

      appId:
        "1:96363004027:web:101c3b8ba1fde53655e2de",

      measurementId:
        "G-WEK1MZ48M2"

    };


    const app =
      initializeApp(firebaseConfig);

    const db =
      getFirestore(app);

    const auth =
      getAuth(app);


    let currentSessionId = null;

    let loggedInUser = null;


    /*
      ZONE ASSIGNMENTS
    */

    const zonePeople = {

      "AG": ["Vishnu", "Grace"],

      "A1": ["Manoj", "Pukar"],

      "A2": ["Rhys", "Laura Nulty"],

      "BG & B1": ["Abdul", "Salu"],

      "CG": ["Danielle Bishay", "Claire Nami"],

      "C1": ["Hannah Jones", "Amy Jones"],

      "C2": ["Emily Griffin", "Rachael Gabel"],

      "C3": ["Regan", "Olivia Radford"],

      "DG": ["Gavin", "Gemma Harris"],

      "D1": ["Asif", "Rachel Forrest"],

      "D2": ["Lily", "Anthea"],

      "EG": ["Emily Gallone", "Roxanne"],

      "E1": ["Isabel", "Shaimaa"],

      "E2": ["Danielle Jolosa", "Hanan"],

      "E3": ["Erika", "Sarah Barr"],

      "AG (Parents)": ["Aisha", "Conference Room A"]

    };


    /*
      GET ZONE
    */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const zone =
      params.get("zone");


    if (
      !zone ||
      !zonePeople[zone]
    ) {

      document.getElementById(
        "zoneTitle"
      ).textContent =
        "Zone Not Found";

    }

    else {

      document.getElementById(
        "zoneTitle"
      ).textContent =
        zone;


      document.getElementById(
        "zonePeople"
      ).innerHTML =

        "<strong>Lead:</strong> " +
        zonePeople[zone][0] +

        "<br>" +

        "<strong>Deputy / Location:</strong> " +
        zonePeople[zone][1];

    }


    const safeButton =
      document.getElementById(
        "safeButton"
      );

    const missingButton =
      document.getElementById(
        "missingButton"
      );

    const unsafeButton =
      document.getElementById(
        "unsafeButton"
      );

    const missingForm =
      document.getElementById(
        "missingForm"
      );

    const unsafeForm =
      document.getElementById(
        "unsafeForm"
      );

    const result =
      document.getElementById(
        "result"
      );


    /*
      LOGIN + LOAD SESSION
    */

    onAuthStateChanged(
      auth,
      async function(user) {

        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        loggedInUser =
          user;


        try {

          const sessionRef =
            doc(
              db,
              "system",
              "currentSession"
            );


          const sessionSnap =
            await getDoc(
              sessionRef
            );


          if (
            !sessionSnap.exists()
          ) {

            alert(
              "No active safety session found. Please open the Dashboard and start a new session."
            );

            return;

          }


          const sessionData =
            sessionSnap.data();


          currentSessionId =
            sessionData.sessionId;


        }

        catch (error) {

          console.error(error);

          alert(
            "Unable to load the current safety session."
          );

        }

      }
    );


    /*
      SHOW RESULT
    */

    function showResult(
      message,
      type
    ) {

      result.className =
        "result " + type;

      result.innerHTML =
        message;

      result.style.display =
        "block";

      window.scrollTo({

        top:
          document.body.scrollHeight,

        behavior:
          "smooth"

      });

    }


    /*
      SAVE SIMPLE STATUS
    */

    async function saveStatus(status) {

      if (!currentSessionId) {

        alert(
          "No active safety session. Please return to the Dashboard and start a session."
        );

        return;

      }


      try {

        await addDoc(

          collection(
            db,
            "checkins"
          ),

          {

            sessionId:
              currentSessionId,

            zone:
              zone,

            status:
              status,

            lead:
              zonePeople[zone][0],

            deputy:
              zonePeople[zone][1],

            checkedAt:
              serverTimestamp(),

            submittedBy:
              loggedInUser
                ? loggedInUser.email
                : ""

          }

        );


        missingForm.style.display =
          "none";

        unsafeForm.style.display =
          "none";


        if (
          status ===
          "ALL SAFE"
        ) {

          showResult(

            "✓ Zone is Secure<br><br>" +
            "All personnel and students are accounted for.",

            "safe"

          );

        }


        if (
          status ===
          "NOT SAFE"
        ) {

          showResult(

            "⚠ NOT SAFE report saved.<br><br>" +
            "Please contact Security / SLT immediately.",

            "unsafe"

          );

        }


      }

      catch (error) {

        console.error(error);

        alert(
          "Unable to save the report. Please try again."
        );

      }

    }


    /*
      ALL SAFE
    */

    safeButton.addEventListener(
      "click",
      function() {

        saveStatus(
          "ALL SAFE"
        );

      }
    );


    /*
      MISSING
    */

    missingButton.addEventListener(
      "click",
      function() {

        unsafeForm.style.display =
          "none";

        result.style.display =
          "none";

        missingForm.style.display =
          "block";

        document
          .getElementById(
            "personName"
          )
          .focus();

      }
    );


    /*
      SAVE MISSING
    */

    document
      .getElementById(
        "saveMissingButton"
      )
      .addEventListener(
        "click",
        async function() {

          if (!currentSessionId) {

            alert(
              "No active safety session. Please return to the Dashboard."
            );

            return;

          }


          const personName =
            document
              .getElementById(
                "personName"
              )
              .value
              .trim();


          const lastLocation =
            document
              .getElementById(
                "lastLocation"
              )
              .value
              .trim();


          const details =
            document
              .getElementById(
                "missingDetails"
              )
              .value
              .trim();


          if (
            !personName ||
            !lastLocation
          ) {

            alert(
              "Please enter the person's name and last known location."
            );

            return;

          }


          try {

            await addDoc(

              collection(
                db,
                "checkins"
              ),

              {

                sessionId:
                  currentSessionId,

                zone:
                  zone,

                status:
                  "MISSING",

                lead:
                  zonePeople[zone][0],

                deputy:
                  zonePeople[zone][1],

                personName:
                  personName,

                lastLocation:
                  lastLocation,

                details:
                  details,

                checkedAt:
                  serverTimestamp(),

                submittedBy:
                  loggedInUser
                    ? loggedInUser.email
                    : ""

              }

            );


            missingForm.style.display =
              "none";


            document
              .getElementById(
                "personName"
              )
              .value =
              "";

            document
              .getElementById(
                "lastLocation"
              )
              .value =
              "";

            document
              .getElementById(
                "missingDetails"
              )
              .value =
              "";


            showResult(

              "⚠ Missing person report saved.<br><br>" +
              "Please continue searching and inform Security / SLT.",

              "missing"

            );

          }

          catch (error) {

            console.error(error);

            alert(
              "Unable to save the missing report. Please try again."
            );

          }

        }
      );


    /*
      CANCEL MISSING
    */

    document
      .getElementById(
        "cancelMissingButton"
      )
      .addEventListener(
        "click",
        function() {

          missingForm.style.display =
            "none";

        }
      );


    /*
      NOT SAFE
    */

    unsafeButton.addEventListener(
      "click",
      function() {

        missingForm.style.display =
          "none";

        result.style.display =
          "none";

        unsafeForm.style.display =
          "block";

        document
          .getElementById(
            "safetyConcern"
          )
          .focus();

      }
    );


    /*
      SAVE NOT SAFE
    */

    document
      .getElementById(
        "saveUnsafeButton"
      )
      .addEventListener(
        "click",
        async function() {

          if (!currentSessionId) {

            alert(
              "No active safety session. Please return to the Dashboard."
            );

            return;

          }


          const safetyConcern =
            document
              .getElementById(
                "safetyConcern"
              )
              .value
              .trim();


          const issueLocation =
            document
              .getElementById(
                "issueLocation"
              )
              .value
              .trim();


          const details =
            document
              .getElementById(
                "unsafeDetails"
              )
              .value
              .trim();


          const immediateAssistance =
            document
              .getElementById(
                "immediateAssistance"
              )
              .value;


          if (
            !safetyConcern ||
            !issueLocation ||
            !immediateAssistance
          ) {

            alert(
              "Please complete the safety concern, location and immediate assistance fields."
            );

            return;

          }


          try {

            await addDoc(

              collection(
                db,
                "checkins"
              ),

              {

                sessionId:
                  currentSessionId,

                zone:
                  zone,

                status:
                  "NOT SAFE",

                lead:
                  zonePeople[zone][0],

                deputy:
                  zonePeople[zone][1],

                safetyConcern:
                  safetyConcern,

                issueLocation:
                  issueLocation,

                details:
                  details,

                immediateAssistance:
                  immediateAssistance,

                checkedAt:
                  serverTimestamp(),

                submittedBy:
                  loggedInUser
                    ? loggedInUser.email
                    : ""

              }

            );


            unsafeForm.style.display =
              "none";


            document
              .getElementById(
                "safetyConcern"
              )
              .value =
              "";

            document
              .getElementById(
                "issueLocation"
              )
              .value =
              "";

            document
              .getElementById(
                "unsafeDetails"
              )
              .value =
              "";

            document
              .getElementById(
                "immediateAssistance"
              )
              .value =
              "";


            showResult(

              "⚠ NOT SAFE report saved.<br><br>" +
              "Please contact Security / SLT immediately.",

              "unsafe"

            );

          }

          catch (error) {

            console.error(error);

            alert(
              "Unable to save the safety report. Please try again."
            );

          }

        }
      );


    /*
      CANCEL NOT SAFE
    */

    document
      .getElementById(
        "cancelUnsafeButton"
      )
      .addEventListener(
        "click",
        function() {

          unsafeForm.style.display =
            "none";

        }
      );

  </script>

</body>
</html>
```
