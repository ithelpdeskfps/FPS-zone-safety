<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zone Safety Check-In</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .header {
      background: #17365d;
      color: white;
      padding: 18px;
      text-align: center;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .zone-card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      text-align: center;
    }

    .zone-title {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #17365d;
    }

    .zone-people {
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .status-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
    }

    .status-button {
      width: 220px;
      height: 60px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      text-align: center;
    }

    .status-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .safe-button {
      background: #16a34a;
    }

    .missing-button {
      background: #f59e0b;
    }

    .unsafe-button {
      background: #dc2626;
    }

    .status-button:hover:not(:disabled) {
      opacity: 0.9;
    }

    .form-box {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border-radius: 10px;
      text-align: left;
    }

    .missing-form {
      background: #fff7e6;
      border: 1px solid #f59e0b;
    }

    .unsafe-form {
      background: #fff0f0;
      border: 1px solid #dc2626;
    }

    .form-box h3 {
      margin-top: 0;
      text-align: center;
    }

    .form-box label {
      display: block;
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 5px;
    }

    .form-box input,
    .form-box textarea,
    .form-box select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .form-box textarea {
      min-height: 90px;
      resize: vertical;
    }

    .save-button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: none;
      border-radius: 7px;
      background: #17365d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .cancel-button {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #aaa;
      border-radius: 7px;
      background: white;
      color: #333;
      font-size: 15px;
      cursor: pointer;
    }

    .result {
      display: none;
      margin-top: 25px;
      padding: 18px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
    }

    .result.safe {
      background: #dcfce7;
      color: #166534;
    }

    .result.missing {
      background: #fef3c7;
      color: #92400e;
    }

    .result.unsafe {
      background: #fee2e2;
      color: #991b1b;
    }

    .back-button {
      display: block;
      width: 220px;
      margin: 25px auto 0;
      padding: 12px;
      text-align: center;
      background: #17365d;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      color: #64748b;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Zone Safety Check-In</h1>
  </div>

  <div class="container">

    <div class="zone-card">

      <div id="zoneTitle" class="zone-title">
        Zone
      </div>

      <div id="zonePeople" class="zone-people"></div>

      <div id="systemStatus" class="loading">
        Loading safety session...
      </div>

      <div class="status-buttons">

        <button id="safeButton"
                class="status-button safe-button">
          ALL SAFE
        </button>

        <button id="missingButton"
                class="status-button missing-button">
          MISSING
        </button>

        <button id="unsafeButton"
                class="status-button unsafe-button">
          NOT SAFE
        </button>

      </div>

      <!-- MISSING FORM -->

      <div id="missingForm" class="form-box missing-form">

        <h3>Missing Person Details</h3>

       <label>Student Name</label>

        <input
          type="text"
          id="personName"
          placeholder="Enter person's name"
        >

        <label for="lastLocation">
          Last Known Location
        </label>

        <input
          type="text"
          id="lastLocation"
          placeholder="Example: Classroom C2"
        >

        <label for="missingDetails">
          Additional Details
        </label>

        <textarea
          id="missingDetails"
          placeholder="Enter any additional information"
        ></textarea>

        <button id="saveMissingButton"
                class="save-button">
          Save Missing Report
        </button>

        <button id="cancelMissingButton"
                class="cancel-button">
          Cancel
        </button>

      </div>

      <!-- NOT SAFE FORM -->

      <div id="unsafeForm" class="form-box unsafe-form">

        <h3>Safety Concern Details</h3>

        <label for="safetyConcern">
          What is the safety concern?
        </label>

        <input
          type="text"
          id="safetyConcern"
          placeholder="Example: Fire, smoke, damaged area"
        >

        <label for="issueLocation">
          Where is the issue?
        </label>

        <input
          type="text"
          id="issueLocation"
          placeholder="Example: Corridor outside C2"
        >

        <label for="unsafeDetails">
          Additional Details
        </label>

        <textarea
          id="unsafeDetails"
          placeholder="Enter any additional information"
        ></textarea>

        <label for="immediateAssistance">
          Is immediate assistance required?
        </label>

        <select id="immediateAssistance">

          <option value="">
            Please select
          </option>

          <option value="Yes">
            Yes
          </option>

          <option value="No">
            No
          </option>

        </select>

        <button id="saveUnsafeButton"
                class="save-button">
          Save Safety Report
        </button>

        <button id="cancelUnsafeButton"
                class="cancel-button">
          Cancel
        </button>

      </div>

      <div id="result" class="result"></div>

      <a href="zones.html"
         class="back-button">
        Back to Zones
      </a>

    </div>

  </div>


  <!-- FIREBASE -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* FIREBASE CONFIG */

    const firebaseConfig = {

      apiKey:
        "AIzaSyB0--wrOqeid_iVGJkqDwJAWBefPyI4HPQw",

      authDomain:
        "fps-zone-safety.firebaseapp.com",

      projectId:
        "fps-zone-safety",

      storageBucket:
        "fps-zone-safety.firebasestorage.app",

      messagingSenderId:
        "96363004027",

      appId:
        "1:96363004027:web:101c3b8ba1fde53655e2de",

      measurementId:
        "G-WEK1MZ48M2"

    };


    /* INITIALIZE FIREBASE */

    const app =
      initializeApp(firebaseConfig);

    const db =
      getFirestore(app);


    let currentSessionId = null;


    /* ZONE ASSIGNMENTS */

    const zonePeople = {

      "AG": ["Vishnu", "Grace"],

      "A1": ["Manoj", "Pukar"],

      "A2": ["Rhys", "Laura Nulty"],

      "BG & B1": ["Abdul", "Salu"],

      "CG": ["Danielle Bishay", "Claire Nami"],

      "C1": ["Hannah Jones", "Amy Jones"],

      "C2": ["Emily Griffin", "Rachael Gabel"],

      "C3": ["Regan", "Olivia Radford"],

      "DG": ["Gavin", "Gemma Harris"],

      "D1": ["Asif", "Rachel Forrest"],

      "D2": ["Lily", "Anthea"],

      "EG": ["Emily Gallone", "Roxanne"],

      "E1": ["Isabel", "Shaimaa"],

      "E2": ["Danielle Jolosa", "Hanan"],

      "E3": ["Erika", "Sarah Barr"],

      "AG (Parents)": ["Aisha", "Conference Room A"]

    };


    /* GET ZONE FROM URL */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const zone =
      params.get("zone");


    if (!zone || !zonePeople[zone]) {

      document.getElementById(
        "zoneTitle"
      ).textContent =
        "Zone Not Found";

      document.getElementById(
        "systemStatus"
      ).textContent =
        "Invalid zone.";

    } else {

      document.getElementById(
        "zoneTitle"
      ).textContent =
        zone;

      document.getElementById(
        "zonePeople"
      ).innerHTML =

        "<strong>Lead:</strong> " +
        zonePeople[zone][0] +

        "<br>" +

        "<strong>Deputy / Location:</strong> " +
        zonePeople[zone][1];

    }


    /* BUTTONS */

    const safeButton =
      document.getElementById("safeButton");

    const missingButton =
      document.getElementById("missingButton");

    const unsafeButton =
      document.getElementById("unsafeButton");

    const missingForm =
      document.getElementById("missingForm");

    const unsafeForm =
      document.getElementById("unsafeForm");

    const result =
      document.getElementById("result");

    const systemStatus =
      document.getElementById("systemStatus");


    /* DISABLE BUTTONS UNTIL SESSION IS LOADED */

    safeButton.disabled = true;
    missingButton.disabled = true;
    unsafeButton.disabled = true;


    /* GET CURRENT SAFETY SESSION */

    async function getCurrentSession() {

      const sessionRef =
        doc(
          db,
          "system",
          "currentSession"
        );

      const sessionSnap =
        await getDoc(sessionRef);


      if (!sessionSnap.exists()) {

        throw new Error(
          "No active safety session found."
        );

      }


      const sessionData =
        sessionSnap.data();


      if (!sessionData.sessionId) {

        throw new Error(
          "Current safety session ID is missing."
        );

      }


      currentSessionId =
        sessionData.sessionId;


      return currentSessionId;

    }


    /* LOAD SESSION */

    async function initialisePage() {

      try {

        await getCurrentSession();

        systemStatus.textContent =
          "Safety session active.";

        systemStatus.style.color =
          "#166534";

        safeButton.disabled = false;
        missingButton.disabled = false;
        unsafeButton.disabled = false;

      }

      catch (error) {

        console.error(
          "Session loading error:",
          error
        );

        systemStatus.textContent =
          error.message;

        systemStatus.style.color =
          "#dc2626";

        safeButton.disabled = true;
        missingButton.disabled = true;
        unsafeButton.disabled = true;

        alert(
          "No active safety session found. Please return to the Dashboard and click START NEW SAFETY SESSION."
        );

      }

    }


    /* SHOW RESULT */

    function showResult(message, type) {

      result.className =
        "result " + type;

      result.innerHTML =
        message;

      result.style.display =
        "block";

      window.scrollTo({

        top:
          document.body.scrollHeight,

        behavior:
          "smooth"

      });

    }


    /* SAVE SIMPLE STATUS */

    async function saveStatus(status) {

      try {

        await getCurrentSession();


        await addDoc(

          collection(
            db,
            "checkins"
          ),

          {

            sessionId:
              currentSessionId,

            zone:
              zone,

            status:
              status,

            lead:
              zonePeople[zone][0],

            deputy:
              zonePeople[zone][1],

            checkedAt:
              serverTimestamp(),

            submittedBy:
              "Anonymous"

          }

        );


        missingForm.style.display =
          "none";

        unsafeForm.style.display =
          "none";


        if (status === "safe") {

          showResult(

            "✓ Zone is Secure<br><br>" +
            "All personnel and students are accounted for.",

            "safe"

          );

        }

      }

      catch (error) {

        console.error(
          "Save status error:",
          error
        );

        alert(
          "Unable to save the report: " +
          (error.message || error)
        );

      }

    }


    /* ALL SAFE */

    safeButton.addEventListener(
      "click",
      function() {

        saveStatus("safe");

      }
    );


    /* MISSING */

    missingButton.addEventListener(
      "click",
      function() {

        unsafeForm.style.display =
          "none";

        result.style.display =
          "none";

        missingForm.style.display =
          "block";

        document
          .getElementById("personName")
          .focus();

      }
    );


    /* SAVE MISSING */

    document
      .getElementById("saveMissingButton")
      .addEventListener(
        "click",
        async function() {

          try {

            await getCurrentSession();


            const personName =
              document
                .getElementById("personName")
                .value
                .trim();


            const lastLocation =
              document
                .getElementById("lastLocation")
                .value
                .trim();


            const missingDetails =
              document
                .getElementById("missingDetails")
                .value
                .trim();


            if (!personName || !lastLocation) {

              alert(
                "Please enter the person's name and last known location."
              );

              return;

            }


            await addDoc(

              collection(
                db,
                "checkins"
              ),

              {

                sessionId:
                  currentSessionId,

                zone:
                  zone,

                status:
                  "missing",

                lead:
                  zonePeople[zone][0],

                deputy:
                  zonePeople[zone][1],

                personName:
                  personName,

                lastLocation:
                  lastLocation,

                missingDetails:
                  missingDetails,

                checkedAt:
                  serverTimestamp(),

                submittedBy:
                  "Anonymous"

              }

            );


            missingForm.style.display =
              "none";


            document
              .getElementById("personName")
              .value = "";

            document
              .getElementById("lastLocation")
              .value = "";

            document
              .getElementById("missingDetails")
              .value = "";


            showResult(

              "⚠ Missing person report saved.<br><br>" +
              "Please continue searching and inform Security / SLT.",

              "missing"

            );

          }

          catch (error) {

            console.error(
              "Save missing error:",
              error
            );

            alert(
              "Unable to save the missing report: " +
              (error.message || error)
            );

          }

        }
      );


    /* CANCEL MISSING */

    document
      .getElementById("cancelMissingButton")
      .addEventListener(
        "click",
        function() {

          missingForm.style.display =
            "none";

        }
      );


    /* NOT SAFE */

    unsafeButton.addEventListener(
      "click",
      function() {

        missingForm.style.display =
          "none";

        result.style.display =
          "none";

        unsafeForm.style.display =
          "block";

        document
          .getElementById("safetyConcern")
          .focus();

      }
    );


    /* SAVE NOT SAFE */

    document
      .getElementById("saveUnsafeButton")
      .addEventListener(
        "click",
        async function() {

          try {

            await getCurrentSession();


            const safetyConcern =
              document
                .getElementById("safetyConcern")
                .value
                .trim();


            const issueLocation =
              document
                .getElementById("issueLocation")
                .value
                .trim();


            const unsafeDetails =
              document
                .getElementById("unsafeDetails")
                .value
                .trim();


            const immediateAssistance =
              document
                .getElementById("immediateAssistance")
                .value;


            if (
              !safetyConcern ||
              !issueLocation ||
              !immediateAssistance
            ) {

              alert(
                "Please complete the safety concern, location and immediate assistance fields."
              );

              return;

            }


            await addDoc(

              collection(
                db,
                "checkins"
              ),

              {

                sessionId:
                  currentSessionId,

                zone:
                  zone,

                status:
                  "unsafe",

                lead:
                  zonePeople[zone][0],

                deputy:
                  zonePeople[zone][1],

                safetyConcern:
                  safetyConcern,

                issueLocation:
                  issueLocation,

                unsafeDetails:
                  unsafeDetails,

                immediateAssistance:
                  immediateAssistance,

                checkedAt:
                  serverTimestamp(),

                submittedBy:
                  "Anonymous"

              }

            );


            unsafeForm.style.display =
              "none";


            document
              .getElementById("safetyConcern")
              .value = "";

            document
              .getElementById("issueLocation")
              .value = "";

            document
              .getElementById("unsafeDetails")
              .value = "";

            document
              .getElementById("immediateAssistance")
              .value = "";


            showResult(

              "⚠ NOT SAFE report saved.<br><br>" +
              "Please contact Security / SLT immediately.",

              "unsafe"

            );

          }

          catch (error) {

            console.error(
              "Save unsafe error:",
              error
            );

            alert(
              "Unable to save the safety report: " +
              (error.message || error)
            );

          }

        }
      );


    /* CANCEL NOT SAFE */

    document
      .getElementById("cancelUnsafeButton")
      .addEventListener(
        "click",
        function() {

          unsafeForm.style.display =
            "none";

        }
      );


    /* START PAGE */

    initialisePage();

  </script>

</body>
</html>
