```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zone Safety Check-In</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #1e293b;
    }

    header {
      background: #17365d;
      color: white;
      padding: 25px 30px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 6px 0 0;
      opacity: 0.9;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 35px 20px;
    }

    .zone-card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .zone-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .zone-title h2 {
      margin: 0;
      font-size: 32px;
      color: #17365d;
    }

    .zone-title p {
      color: #64748b;
      margin-top: 12px;
      line-height: 1.8;
      font-size: 15px;
    }

    /* STATUS BUTTONS */

    .status-buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
    }

    .status-button {
      display: block;
      width: 100%;
      min-height: 75px;
      border: none;
      border-radius: 12px;
      padding: 20px;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      text-align: center;
    }

    .safe-button {
      background: #16a34a;
    }

    .safe-button:hover {
      background: #15803d;
    }

    .missing-button {
      background: #f59e0b;
    }

    .missing-button:hover {
      background: #d97706;
    }

    .unsafe-button {
      background: #dc2626;
    }

    .unsafe-button:hover {
      background: #b91c1c;
    }

    /* MISSING FORM */

    .form-box {
      display: none;
      margin-top: 25px;
      padding: 25px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 12px;
    }

    .form-box h3 {
      margin-top: 0;
      color: #92400e;
      font-size: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 100px;
      resize: vertical;

    .save-button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: #2563eb;

      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .save-button:hover {
      background: #1d4ed8;
    }

    .cancel-button {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      background: #e2e8f0;
      color: #334155;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    /* RESULT */

    .result {
      display: none;
      margin-top: 25px;

    .result.safe {
      background: #dcfce7;
      color: #166534;
    }

      background: #fef3c7;

    .result.unsafe {
      background: #fee2e2;
      color: #991b1b;

    .back-link {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      header {
        padding: 20px;
      }

      header h1 {
        font-size: 23px;
      }

      main {
        padding: 20px 15px;
      }

      .zone-card {
        padding: 22px;
      }

      .zone-title h2 {
        font-size: 28px;
      }

      .status-button {
        min-height: 70px;
        font-size: 19px;
      }
    }

  </style>
</head>

<body>

<header>
  <h1>Zone Safety Check-In</h1>
  <p>Emergency Coverage & Safety Management</p>
</header>

<main>

  <div class="zone-card">

    <div class="zone-title">

      <h2 id="zoneName">Zone</h2>

      <p id="zonePeople"></p>

    </div>


    <!-- STATUS BUTTONS -->

    <div class="status-buttons">

      <button
        id="safeButton"
        class="status-button safe-button">
        ALL SAFE
      </button>

      <button
        id="missingButton"
        class="status-button missing-button">
        MISSING
      </button>

      <button
        id="unsafeButton"
        class="status-button unsafe-button">
        NOT SAFE
      </button>

    </div>


    <!-- MISSING FORM -->

    <div id="missingForm" class="form-box">

      <h3>Missing Person Details</h3>

      <label for="personName">
        Person's Name
      </label>

      <input
        type="text"
        id="personName"
        placeholder="Enter person's name">


      <label for="lastLocation">
        Last Known Location
      </label>

      <input
        type="text"
        id="lastLocation"
        placeholder="Example: Classroom C2">


      <label for="missingDetails">
        Additional Details
      </label>

      <textarea
        id="missingDetails"
        placeholder="Enter any additional information"></textarea>


      <button
        id="saveMissingButton"
        class="save-button">
        Save Missing Report
      </button>

      <button
        id="cancelMissingButton"
        class="cancel-button">
        Cancel
      </button>

    </div>


    <!-- RESULT MESSAGE -->

    <div id="result" class="result"></div>


    <a href="zones.html" class="back-link">
      ← Back to Zones
    </a>

  </div>

</main>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
  }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /* FIREBASE */

  const firebaseConfig = {
    apiKey: "AIzaSyB0--wrOqeid_iVGJkqDwJAWBefPyI4HPw",
    authDomain: "fps-zone-safety.firebaseapp.com",
    projectId: "fps-zone-safety",
    storageBucket: "fps-zone-safety.firebasestorage.app",
    messagingSenderId: "96363004027",
    appId: "1:96363004027:web:101c3b8ba1fde53655e2de",
    measurementId: "G-WEK1MZ48M2"
  };


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);


  /* GET ZONE FROM URL */

  const params =
    new URLSearchParams(window.location.search);

  const zone =
    params.get("zone") || "Unknown";


  /* ZONE ASSIGNMENTS */

  const zonePeople = {

    "AG": ["Vishnu", "Grace"],

    "A1": ["Manoj", "Pukar"],

    "A2": ["Rhys", "Laura Nulty"],

    "BG & B1": ["Abdul", "Salu"],

    "CG": ["Danielle Bishay", "Claire Nami"],

    "C1": ["Hannah Jones", "Amy Jones"],

    "C2": ["Emily Griffin", "Rachael Gabel"],

    "C3": ["Regan", "Olivia Radford"],

    "DG": ["Gavin", "Gemma Harris"],

    "D1": ["Asif", "Rachel Forrest"],

    "D2": ["Lily", "Anthea"],

    "EG": ["Emily Gallone", "Roxanne"],

    "E1": ["Isabel", "Shaimaa"],

    "E2": ["Danielle Jolosa", "Hanan"],

    "E3": ["Erika", "Sarah Barr"],

    "AG (Parents)": ["Aisha", "Conference Room A"]

  };


  /* DISPLAY ZONE */

  document
    .getElementById("zoneName")
    .textContent = zone;


  if (zonePeople[zone]) {

    document
      .getElementById("zonePeople")
      .innerHTML =
        "<strong>Lead:</strong> " +
        zonePeople[zone][0] +
        "<br>" +
        "<strong>Deputy / Location:</strong> " +
        zonePeople[zone][1];

  }


  /* ELEMENTS */

  const missingForm =
    document.getElementById("missingForm");

  const result =
    document.getElementById("result");


  /* ALL SAFE */

  document
    .getElementById("safeButton")
    .addEventListener("click", function() {

      saveStatus("ALL SAFE");

    });


  /* NOT SAFE */

  document
    .getElementById("unsafeButton")
    .addEventListener("click", function() {

      saveStatus("NOT SAFE");

    });


  /* MISSING */

  document
    .getElementById("missingButton")
    .addEventListener("click", function() {

      missingForm.style.display = "block";

      result.style.display = "none";

      document
        .getElementById("personName")
        .focus();

    });


  /* CANCEL */

  document
    .getElementById("cancelMissingButton")
    .addEventListener("click", function() {

      missingForm.style.display = "none";

    });


  /* SAVE MISSING REPORT */

  document
    .getElementById("saveMissingButton")
    .addEventListener("click", async function() {

      const personName =
        document
          .getElementById("personName")
          .value
          .trim();


      const lastLocation =
        document
          .getElementById("lastLocation")
          .value
          .trim();


      const details =
        document
          .getElementById("missingDetails")
          .value
          .trim();


      if (!personName) {

        alert(
          "Please enter the person's name."
        );

        return;

      }


      if (!lastLocation) {

        alert(
          "Please enter the last known location."
        );

        return;

      }


      try {

        await addDoc(
          collection(db, "checkins"),
          {

            zone: zone,

            status: "MISSING",

            lead:
              zonePeople[zone]
                ? zonePeople[zone][0]
                : "",

            deputy:
              zonePeople[zone]
                ? zonePeople[zone][1]
                : "",

            personName: personName,

            lastLocation: lastLocation,

            details: details,

            checkedAt:
              serverTimestamp()

          }
        );


        missingForm.style.display =
          "none";


        result.className =
          "result missing";


        result.style.display =
          "block";


        result.innerHTML =
          "MISSING report saved successfully.<br><br>" +
          "<strong>" +
          personName +
          "</strong><br>" +
          lastLocation;


        document
          .getElementById("personName")
          .value = "";


        document
          .getElementById("lastLocation")
          .value = "";


        document
          .getElementById("missingDetails")
          .value = "";


      }

      catch (error) {

        console.error(error);

        alert(
          "Unable to save the missing report. Please try again."
        );

      }

    });


  /* SAVE SAFE / NOT SAFE */

  async function saveStatus(status) {

    try {

      const person =
        zonePeople[zone] || ["", ""];


      await addDoc(
        collection(db, "checkins"),
        {

          zone: zone,

          status: status,

          lead: person[0],

          deputy: person[1],

          checkedAt:
            serverTimestamp()

        }
      );


      result.style.display =
        "block";


      if (status === "ALL SAFE") {

        result.className =
          "result safe";


        result.innerHTML =
          "<strong>Zone is Secure</strong><br>" +
          "All personnel and students are accounted for.";

      }

      else {

        result.className =
          "result unsafe";


        result.innerHTML =
          "<strong>NOT SAFE has been recorded.</strong><br>" +
          "Please follow the emergency procedure.";

      }

    }

    catch (error) {

      console.error(error);

      alert(
        "Unable to save the status. Please try again."
      );

    }

  }

</script>

</body>
</html>
